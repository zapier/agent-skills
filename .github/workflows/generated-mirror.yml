# This repository is generated from an internal Zapier repository, and every
# export replaces its contents. A pull request here can't be merged, so this
# check explains that on the PR and fails.
#
# pull_request_target (not pull_request) so the token can comment on PRs from
# forks. That is safe here only because no step checks out or runs PR code.
# No secrets are used; GITHUB_TOKEN is scoped to pull-requests: write.
name: Generated mirror

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  pull-requests: write

jobs:
  generated-mirror:
    name: Pull requests are not merged here
    runs-on: ubuntu-latest
    steps:
      - name: Comment and fail
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          ACTION: ${{ github.event.action }}
        run: |
          # Comment once per open/reopen, not on every push to the PR.
          if [ "$ACTION" != "synchronize" ]; then
            gh pr comment "$PR_URL" --body-file - <<'EOF'
          Thanks for the pull request. This repository is generated from an internal Zapier repository, and each export replaces its contents, so pull requests here are not merged.

          If you found a problem or want a change, please open an issue that names the skill, what you expected, and what happened. A Zapier maintainer will make the change in the internal source, and it will appear here with the next export. A maintainer may use this pull request as a reference for that change and will then close it.
          EOF
          fi
          echo "::error::This repository is a generated mirror; pull requests are not merged. See README.md#contributing."
          exit 1
